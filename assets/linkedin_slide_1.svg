<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <radialGradient id="blueGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="greenGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#34A853" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34A853" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg1)" />
  <circle cx="200" cy="200" r="400" fill="url(#blueGlow)" />
  <circle cx="900" cy="900" r="450" fill="url(#greenGlow)" />

  <!-- Grid Pattern -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.4">
    <line x1="0" y1="216" x2="1080" y2="216" stroke-dasharray="8,8" />
    <line x1="0" y1="432" x2="1080" y2="432" stroke-dasharray="8,8" />
    <line x1="0" y1="648" x2="1080" y2="648" stroke-dasharray="8,8" />
    <line x1="0" y1="864" x2="1080" y2="864" stroke-dasharray="8,8" />

    <line x1="216" y1="0" x2="216" y2="1080" stroke-dasharray="8,8" />
    <line x1="432" y1="0" x2="432" y2="1080" stroke-dasharray="8,8" />
    <line x1="648" y1="0" x2="648" y2="1080" stroke-dasharray="8,8" />
    <line x1="864" y1="0" x2="864" y2="1080" stroke-dasharray="8,8" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="360" height="46" rx="23" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="180" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#93c5fd" text-anchor="middle">
      ⭐ Google Student Ambassador Initiative
    </text>
  </g>

  <!-- Main Card -->
  <rect x="80" y="160" width="920" height="740" rx="32" fill="#111827" fill-opacity="0.85" stroke="#374151" stroke-width="2" filter="url(#shadow1)" />

  <!-- Main Header -->
  <g transform="translate(130, 260)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
      <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC04">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
      <tspan fill="#ffffff"> &amp; Alphabet</tspan>
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif" font-size="52" font-weight="700" fill="#38bdf8">
      Mega-Ecosystem Atlas
    </text>
    <text y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#9ca3af">
      Planetary Directory of 10,263+ Official Endpoints
    </text>
  </g>

  <!-- Big Stat Grid inside Card -->
  <g transform="translate(130, 460)">
    <!-- Stat 1 -->
    <rect width="395" height="150" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#38bdf8">10,263+</text>
    <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">Cataloged Websites &amp; APIs</text>
    <text x="30" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Verified &amp; Deduplicated</text>

    <!-- Stat 2 -->
    <g transform="translate(425, 0)">
      <rect width="395" height="150" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="30" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#4ade80">196 Nations</text>
      <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">Sovereign Country Portals</text>
      <text x="30" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">16 Dimensions per Country</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(0, 175)">
      <rect width="395" height="150" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="30" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#fbbf24">7,198+</text>
      <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">Student &amp; GDSC Hubs</text>
      <text x="30" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">4,800+ University Chapters</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(425, 175)">
      <rect width="395" height="150" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="30" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f87171">DeepMind</text>
      <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">Frontier AI &amp; Cloud</text>
      <text x="30" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Gemini, Gemma, AlphaFold 3</text>
    </g>
  </g>

  <!-- Author Footer -->
  <g transform="translate(80, 940)">
    <circle cx="35" cy="35" r="35" fill="#2563eb" />
    <text x="35" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">NM</text>
    
    <text x="90" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#f9fafb">Nandhakumar Murugan</text>
    <text x="90" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#9ca3af">Google Student Ambassador (GSA) • KG KITE</text>

    <!-- Slide indicator -->
    <text x="920" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="end">Slide 1 / 4 →</text>
  </g>
</svg>
