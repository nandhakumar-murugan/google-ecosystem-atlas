    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9ca3af">Google Student Ambassador (GSA)</text>

    <!-- Slide indicator -->
