      <text x="420" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#38bdf8" text-anchor="end">7,198</text>
    </g>

    <g transform="translate(475, 0)">
