name: Dataset Build & Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dataset Generator
        run: |
          python scripts/build_mega_ecosystem.py

      - name: Verify JSON Integrity
        run: |
          python -c "import json; data=json.load(open('data/google_ecosystem.json')); assert len(data['entries']) >= 10000, f'Expected 10k+ entries, found {len(data[\"entries\"])}'; print(f'Verification SUCCESS: {len(data[\"entries\"])} verified endpoints!')"
